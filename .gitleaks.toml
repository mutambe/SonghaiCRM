# Config do gitleaks (SonghaiCRM): o pre-commit (scripts/scan-secrets.mjs delega
# para ele quando está instalado) e o job `secrets` do CI. Estende o ruleset
# default do gitleaks — não reescreve regra nenhuma, só isenta o que foi
# AUDITADO como não-segredo. Separador `[\\/]` para valer também no Windows.
title = "SonghaiCRM"

[extend]
useDefault = true

[allowlist]
description = "Auditado em 2026-10-01 contra a base sobre o upstream v1.69.0 (gitleaks 8.21.2)"
paths = [
  # Testes e specs: chaves, JWTs e segredos INVENTADOS (ex.: a chave Anthropic "…NOVA-CHAVE-ABCD").
  '''(^|[\\/])tests[\\/]''',
  '''\.test\.tsx?$''',
  '''\.spec\.ts$''',
  '''hostgator-setup-kit[\\/]test-validators\.sh$''',
  '''\.github[\\/]workflows[\\/]e2e\.yml$''',
  # Evidência de QA versionada: logs de execução com credencial de teste já redigida.
  '''(^|[\\/])evidence[\\/]''',
  # Cita um id de conversa da API de um canal (24 hex), não uma chave.
  '''supabase[\\/]migrations[\\/]MANIFEST\.md$''',
  # Fusão com o upstream v1.99 (auditado em 2026-11-04, gitleaks 8.21.2): exemplos e
  # fixtures que o upstream distribui, nenhum é credencial. Caminho exato, nunca pasta.
  #   - apostila: palavra-passe de EXEMPLO num comando (`Uma-Senha-Forte-123`);
  #   - e2e: chave do WAHA sintética de um script de teste (`e2e-canal-sintetico-3408`);
  #   - curso: chaves Stripe de DEMONSTRAÇÃO da lição de cobrança (`sk_test_51Curso…`).
  '''^docs[\\/]apostila-contribuidor\.md$''',
  '''^scripts[\\/]e2e-transcricao-openrouter\.ts$''',
  '''^curso[\\/]licoes[\\/]admin-cobranca\.json$''',
  '''^curso[\\/]semear[\\/]admin-cobranca\.ts$''',
]
# Identificadores de produção que a regra de entropia confunde com chave.
regexes = [
  '''^followup-gatilho-[a-z-]+\.v1$''',
  '''^notify\.prefs\.v1$''',
  # Chaves de CONSUMIDOR de evento do upstream v1.99 (nomes, não segredos).
  '''^financeiro\.comanda-do-ganho\.v1$''',
  '''^followup-saida-da-etapa\.v1$''',
]
